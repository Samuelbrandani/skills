# Codex-specific metadata (OpenAI Agent Skills). Optional for other agents.
# Reference: https://learn.chatgpt.com/docs/build-skills and openai/skills curated examples.
interface:
  display_name: "Figma → Flutter"
  short_description: "Implement, redesign or audit a Flutter screen from a Figma node with designer-level fidelity"
  default_prompt: "Use $figma-flutter on this Figma link: implement the screen following the repo's design system and architecture, use only original Figma assets, and finish with the 12-axis conformance check."

# Codex may auto-select the skill when the request matches the description.
allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Official Figma MCP server (get_metadata, get_screenshot, get_variable_defs, get_design_context, download_assets)"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"
